<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>포모도로 공부법</title>
<style>
:root{--bg:#07111f;--panel:#0d1b2e;--panel2:#122844;--text:#eef6ff;--muted:#9bb0c7;--line:#203650;--accent:#72a7ff;--green:#7cf0c6}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,sans-serif;background:radial-gradient(circle at 50% 0,#16365c,transparent 45%),var(--bg);color:var(--text);display:flex;justify-content:center;padding:30px}.app{width:min(900px,100%)}h1{text-align:center;margin:10px 0 4px;font-size:clamp(32px,6vw,52px)}.sub{text-align:center;color:var(--muted);margin:0 0 28px}.panel{background:rgba(13,27,46,.9);border:1px solid var(--line);border-radius:22px;padding:26px;margin-bottom:18px}.timer{text-align:center;font-size:clamp(72px,15vw,130px);font-weight:900;letter-spacing:-.06em;margin:10px 0}.mode{color:var(--green);font-weight:800}.buttons{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:12px 18px;border-radius:12px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:#07111f}.settings{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.settings label{color:var(--muted);font-size:13px}.settings input{width:100%;margin-top:6px;padding:11px;background:#081625;border:1px solid var(--line);color:var(--text);border-radius:10px}.task{display:flex;gap:10px}.task input{flex:1;padding:12px;background:#081625;border:1px solid var(--line);color:var(--text);border-radius:10px}.list{margin-top:14px;display:grid;gap:8px}.item{display:flex;justify-content:space-between;padding:11px 13px;background:#0a1727;border-radius:10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}.stat{padding:15px;background:#0a1727;border-radius:12px}.stat b{display:block;font-size:24px}.muted{color:var(--muted)}@media(max-width:600px){.settings{grid-template-columns:1fr}.task{flex-direction:column}.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<h1>🍅 포모도로 공부법</h1>
<p class="sub">집중과 휴식을 반복하며 공부해 보세요.</p>
<div class="panel">
<div class="mode" id="mode">집중 시간</div>
<div class="timer" id="timer">25:00</div>
<div class="buttons">
<button class="btn primary" id="start">시작</button>
<button class="btn" id="pause">일시정지</button>
<button class="btn" id="reset">초기화</button>
</div>
</div>
<div class="panel">
<h2>공부 설정</h2>
<div class="settings">
<label>집중(분)<input id="focus" type="number" min="1" value="25"></label>
<label>짧은 휴식(분)<input id="short" type="number" min="1" value="5"></label>
<label>긴 휴식(분)<input id="long" type="number" min="1" value="15"></label>
</div>
</div>
<div class="panel">
<h2>오늘의 공부</h2>
<div class="task"><input id="taskInput" placeholder="공부할 내용을 입력하세요"><button class="btn primary" id="add">추가</button></div>
<div class="list" id="tasks"></div>
</div>
<div class="panel">
<h2>공부 기록</h2>
<div class="stats"><div class="stat"><b id="sessions">0</b><span class="muted">완료 세션</span></div><div class="stat"><b id="minutes">0</b><span class="muted">집중 분</span></div><div class="stat"><b id="streak">0</b><span class="muted">오늘 연속</span></div></div>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
let mode='focus',remaining=25*60,running=false,timerId=null;
let sessions=Number(localStorage.pomoSessions||0),minutes=Number(localStorage.pomoMinutes||0);
function duration(){return (mode==='focus'?Number($('focus').value):mode==='short'?Number($('short').value):Number($('long').value))*60}
function render(){const m=String(Math.floor(remaining/60)).padStart(2,'0'),s=String(remaining%60).padStart(2,'0');$('timer').textContent=m+':'+s;$('mode').textContent=mode==='focus'?'집중 시간':mode==='short'?'짧은 휴식':'긴 휴식';$('sessions').textContent=sessions;$('minutes').textContent=minutes;$('streak').textContent=sessions}
function reset(){clearInterval(timerId);running=false;remaining=duration();render()}
function finish(){clearInterval(timerId);running=false;if(mode==='focus'){sessions++;minutes+=Number($('focus').value);localStorage.pomoSessions=sessions;localStorage.pomoMinutes=minutes;mode='short'}else mode='focus';remaining=duration();render()}
$('start').onclick=()=>{if(running)return;running=true;timerId=setInterval(()=>{remaining--;render();if(remaining<=0)finish()},1000)}
$('pause').onclick=()=>{clearInterval(timerId);running=false}
$('reset').onclick=reset
;['focus','short','long'].forEach(id=>$(id).onchange=()=>{if(!running)reset()})
$('add').onclick=()=>{const v=$('taskInput').value.trim();if(!v)return;const tasks=JSON.parse(localStorage.pomoTasks||'[]');tasks.push(v);localStorage.pomoTasks=JSON.stringify(tasks);$('taskInput').value='';drawTasks()}
function drawTasks(){const tasks=JSON.parse(localStorage.pomoTasks||'[]');$('tasks').innerHTML=tasks.length?tasks.map((t,i)=>'<div class="item"><span>'+escapeHtml(t)+'</span><button class="btn" onclick="removeTask('+i+')">삭제</button></div>').join(''):'<div class="muted">아직 등록된 공부 내용이 없습니다.</div>'}
function removeTask(i){const tasks=JSON.parse(localStorage.pomoTasks||'[]');tasks.splice(i,1);localStorage.pomoTasks=JSON.stringify(tasks);drawTasks()}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
reset();drawTasks();
</script>
</body>
</html>
